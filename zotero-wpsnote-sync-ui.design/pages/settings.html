<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置面板 - Zotero → WPS 笔记同步</title>
    <style id="theme-vars">
      /* Zotero → WPS 笔记同步 - 现代简约设计系统 */

      :root {
        /* Brand */
        --zws-primary: #2563eb;
        --zws-primary-hover: #1d4ed8;
        --zws-primary-subtle: #eff6ff;
        --zws-primary-ring: rgba(37, 99, 235, 0.25);

        /* Neutral */
        --zws-bg: #ffffff;
        --zws-card: var(--zws-bg);
        --zws-surface: #f8fafc;
        --zws-surface-hover: #f1f5f9;
        --zws-border: #e2e8f0;
        --zws-border-strong: #cbd5e1;

        /* Text */
        --zws-text: #0f172a;
        --zws-foreground: var(--zws-text);
        --zws-text-secondary: #475569;
        --zws-text-muted: #64748b;
        --zws-muted: var(--zws-text-muted);
        --zws-text-placeholder: #94a3b8;

        /* Status */
        --zws-success: #10b981;
        --zws-success-subtle: #ecfdf5;
        --zws-error: #ef4444;
        --zws-error-subtle: #fef2f2;
        --zws-warning: #f59e0b;
        --zws-warning-subtle: #fffbeb;

        /* Radius */
        --zws-radius-sm: 6px;
        --zws-radius-md: 10px;
        --zws-radius-lg: 14px;
        --zws-radius-xl: 18px;

        /* Shadows */
        --zws-shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
        --zws-shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
        --zws-shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.12);

        /* Spacing */
        --zws-gap-xs: 4px;
        --zws-gap-sm: 8px;
        --zws-gap-md: 16px;
        --zws-gap-lg: 24px;
        --zws-gap-xl: 32px;

        /* Typography */
        --zws-font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        --zws-font-mono:
          "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas,
          "PingFang SC", monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: var(--zws-font);
        color: var(--zws-text);
        background: var(--zws-bg);
        line-height: 1.5;
        margin: 0;
      }

      .zws-card {
        background: var(--zws-bg);
        border: 1px solid var(--zws-border);
        border-radius: var(--zws-radius-lg);
        box-shadow: var(--zws-shadow-sm);
        padding: var(--zws-gap-lg);
      }

      .zws-section-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--zws-text);
        margin: 0 0 var(--zws-gap-md) 0;
        padding-bottom: var(--zws-gap-sm);
        border-bottom: 1px solid var(--zws-border);
      }

      .zws-form-row {
        display: flex;
        align-items: center;
        gap: var(--zws-gap-md);
        margin-bottom: var(--zws-gap-md);
      }

      .zws-form-row:last-child {
        margin-bottom: 0;
      }

      .zws-label {
        min-width: 120px;
        font-size: 13px;
        font-weight: 500;
        color: var(--zws-text-secondary);
        flex-shrink: 0;
      }

      .zws-input,
      .zws-select,
      .zws-textarea {
        flex: 1;
        min-width: 0;
        font-family: var(--zws-font);
        font-size: 13px;
        padding: 8px 12px;
        color: var(--zws-text);
        background: var(--zws-bg);
        border: 1px solid var(--zws-border-strong);
        border-radius: var(--zws-radius-md);
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .zws-input:hover,
      .zws-select:hover,
      .zws-textarea:hover {
        border-color: var(--zws-border-strong);
      }

      .zws-input:focus,
      .zws-select:focus,
      .zws-textarea:focus {
        border-color: var(--zws-primary);
        box-shadow: 0 0 0 3px var(--zws-primary-ring);
      }

      .zws-textarea {
        resize: vertical;
        line-height: 1.6;
      }

      .zws-checkbox-row {
        display: flex;
        align-items: center;
        gap: var(--zws-gap-sm);
        margin-bottom: var(--zws-gap-sm);
        font-size: 13px;
        color: var(--zws-text-secondary);
        cursor: pointer;
      }

      .zws-checkbox-row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: var(--zws-primary);
        cursor: pointer;
      }

      .zws-help-text {
        font-size: 12px;
        color: var(--zws-text-muted);
        margin-top: var(--zws-gap-xs);
        line-height: 1.5;
      }

      .zws-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--zws-gap-sm);
        font-family: var(--zws-font);
        font-size: 13px;
        font-weight: 500;
        padding: 8px 16px;
        border: none;
        border-radius: var(--zws-radius-md);
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.05s,
          box-shadow 0.15s;
      }

      .zws-button:active {
        transform: translateY(1px);
      }

      .zws-button-primary {
        background: var(--zws-primary);
        color: #ffffff;
        box-shadow: var(--zws-shadow-sm);
      }

      .zws-button-primary:hover {
        background: var(--zws-primary-hover);
      }

      .zws-button-secondary {
        background: var(--zws-surface);
        color: var(--zws-text-secondary);
        border: 1px solid var(--zws-border);
      }

      .zws-button-secondary:hover {
        background: var(--zws-surface-hover);
      }

      .zws-button-danger {
        background: var(--zws-error-subtle);
        color: var(--zws-error);
        border: 1px solid #fecaca;
      }

      .zws-button-danger:hover {
        background: #fee2e2;
      }

      .zws-button-small {
        padding: 4px 10px;
        font-size: 12px;
        border-radius: var(--zws-radius-sm);
      }

      .zws-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 13px;
      }

      .zws-table th,
      .zws-table td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid var(--zws-border);
      }

      .zws-table th {
        font-weight: 600;
        color: var(--zws-text-secondary);
        background: var(--zws-surface);
        position: sticky;
        top: 0;
        z-index: 1;
      }

      .zws-table th:first-child {
        border-top-left-radius: var(--zws-radius-md);
      }

      .zws-table th:last-child {
        border-top-right-radius: var(--zws-radius-md);
      }

      .zws-table tbody tr:hover {
        background: var(--zws-surface-hover);
      }

      .zws-status {
        display: inline-flex;
        align-items: center;
        gap: var(--zws-gap-xs);
        font-size: 12px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 999px;
      }

      .zws-status-success {
        background: var(--zws-success-subtle);
        color: #047857;
      }

      .zws-status-error {
        background: var(--zws-error-subtle);
        color: #b91c1c;
      }

      .zws-status-pending {
        background: var(--zws-warning-subtle);
        color: #b45309;
      }

      .zws-dialog {
        background: var(--zws-bg);
        border-radius: var(--zws-radius-xl);
        box-shadow: var(--zws-shadow-lg);
        padding: var(--zws-gap-xl);
        max-width: 480px;
      }

      .zws-dialog-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 var(--zws-gap-sm) 0;
      }

      .zws-dialog-text {
        font-size: 13px;
        color: var(--zws-text-secondary);
        line-height: 1.6;
        margin: 0 0 var(--zws-gap-lg) 0;
      }

      .zws-dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--zws-gap-sm);
      }

      .zws-preview {
        background: var(--zws-surface);
        border: 1px dashed var(--zws-border-strong);
        border-radius: var(--zws-radius-md);
        padding: var(--zws-gap-md);
        font-family: var(--zws-font-mono);
        font-size: 12px;
        color: var(--zws-text-secondary);
        line-height: 1.6;
        white-space: pre-wrap;
        overflow: auto;
      }

      .zws-menu-item {
        display: flex;
        align-items: center;
        gap: var(--zws-gap-sm);
        padding: 6px 12px;
        font-size: 13px;
        color: var(--zws-text);
        border-radius: var(--zws-radius-sm);
      }

      .zws-menu-item:hover {
        background: var(--zws-surface-hover);
      }

      .zws-icon {
        width: 16px;
        height: 16px;
        color: var(--zws-primary);
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
      @theme inline {
        --color-foreground: var(--zws-foreground);
        --color-card: var(--zws-card);
        --color-primary: var(--zws-primary);
        --color-muted: var(--zws-muted);
        --color-border: var(--zws-border);
        --color-background: var(--zws-bg);
        --radius-sm: var(--zws-radius-sm);
        --radius-md: var(--zws-radius-md);
        --radius-lg: var(--zws-radius-lg);
        --radius-xl: var(--zws-radius-xl);
      }
      @layer base {
        body {
          background: var(--zws-bg);
          color: var(--zws-foreground);
        }
        td,
        th {
          @apply break-words;
          word-break: break-all;
          word-break: auto-phrase;
        }
        th {
          @apply whitespace-nowrap;
        }
      }
    </style>
    <style id="semantic-token-fallback">
      .bg-foreground {
        background-color: var(--zws-foreground);
      }
      .text-foreground {
        color: var(--zws-foreground);
      }
      .border-foreground {
        border-color: var(--zws-foreground);
      }
      .ring-foreground {
        --tw-ring-color: var(--zws-foreground);
      }
      .bg-card {
        background-color: var(--zws-card);
      }
      .text-card {
        color: var(--zws-card);
      }
      .border-card {
        border-color: var(--zws-card);
      }
      .ring-card {
        --tw-ring-color: var(--zws-card);
      }
      .bg-primary {
        background-color: var(--zws-primary);
      }
      .text-primary {
        color: var(--zws-primary);
      }
      .border-primary {
        border-color: var(--zws-primary);
      }
      .ring-primary {
        --tw-ring-color: var(--zws-primary);
      }
      .bg-muted {
        background-color: var(--zws-muted);
      }
      .text-muted {
        color: var(--zws-muted);
      }
      .border-muted {
        border-color: var(--zws-muted);
      }
      .ring-muted {
        --tw-ring-color: var(--zws-muted);
      }
      .bg-border {
        background-color: var(--zws-border);
      }
      .text-border {
        color: var(--zws-border);
      }
      .border-border {
        border-color: var(--zws-border);
      }
      .ring-border {
        --tw-ring-color: var(--zws-border);
      }
      .bg-background {
        background-color: var(--zws-bg);
      }
      .text-background {
        color: var(--zws-bg);
      }
      .border-background {
        border-color: var(--zws-bg);
      }
      .ring-background {
        --tw-ring-color: var(--zws-bg);
      }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-header">
        <svg
          class="zws-icon"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M12 2L2 7l10 5 10-5-10-5z" />
          <path d="M2 17l10 5 10-5" />
          <path d="M2 12l10 5 10-5" />
        </svg>
        <h1>Zotero → WPS 笔记同步设置</h1>
        <span class="version">Build 0.1.1</span>
      </div>

      <div class="zws-card card">
        <h2 class="zws-section-title">MCP 连接</h2>
        <div class="zws-form-row">
          <label class="zws-label">MCP 接口类型</label>
          <select class="zws-select">
            <option>云端 MCP</option>
            <option>本地 MCP</option>
          </select>
        </div>
        <div class="zws-form-row">
          <label class="zws-label">云端 MCP 端点</label>
          <input
            class="zws-input"
            type="text"
            value="https://mcp.example.com/api"
          />
        </div>
        <div class="zws-form-row">
          <label class="zws-label">云端 API Key</label>
          <input class="zws-input" type="password" value="••••••••••••" />
        </div>
      </div>

      <div class="zws-card card">
        <h2 class="zws-section-title">同步选项</h2>
        <div class="zws-form-row">
          <label class="zws-label">默认标签</label>
          <input class="zws-input" type="text" value="Zotero, 文献" />
        </div>
        <div class="checkbox-grid">
          <label class="zws-checkbox-row"
            ><input type="checkbox" checked /> 更新已存在的笔记</label
          >
          <label class="zws-checkbox-row"
            ><input type="checkbox" checked /> 启用增量同步</label
          >
          <label class="zws-checkbox-row"
            ><input type="checkbox" checked /> 冲突时提示</label
          >
        </div>
      </div>

      <div class="zws-card card">
        <h2 class="zws-section-title">同步内容</h2>
        <div class="checkbox-grid">
          <label class="zws-checkbox-row"
            ><input type="checkbox" checked /> 摘要</label
          >
          <label class="zws-checkbox-row"
            ><input type="checkbox" checked /> 附件</label
          >
          <label class="zws-checkbox-row"
            ><input type="checkbox" checked /> PDF 批注</label
          >
          <label class="zws-checkbox-row"
            ><input type="checkbox" checked /> 标签</label
          >
          <label class="zws-checkbox-row"
            ><input type="checkbox" /> 文献笔记</label
          >
        </div>
      </div>

      <div class="zws-card card">
        <h2 class="zws-section-title">自动同步</h2>
        <label class="zws-checkbox-row"
          ><input type="checkbox" checked /> 启用自动同步（按标签）</label
        >
        <div class="zws-form-row">
          <label class="zws-label">自动同步标签</label>
          <input class="zws-input" type="text" value="同步到 WPS" />
        </div>
        <p class="zws-help-text">
          给条目添加此标签后自动同步到 WPS，留空则不会触发。
        </p>
      </div>

      <div class="zws-card card">
        <h2 class="zws-section-title">模板与预览</h2>
        <div class="zws-form-row" style="align-items: flex-start">
          <label class="zws-label" style="margin-top: 8px">笔记标题模板</label>
          <textarea class="zws-textarea" rows="1">{{title}}</textarea>
        </div>
        <div class="zws-form-row" style="align-items: flex-start">
          <label class="zws-label" style="margin-top: 8px">笔记正文模板</label>
          <textarea
            class="zws-textarea"
            rows="8"
            style="font-family: var(--zws-font-mono)"
          >
&lt;h1&gt;{{title}}&lt;/h1&gt;
&lt;p&gt;{{authors}} · {{yearOrDate}}&lt;/p&gt;
&lt;p&gt;{{abstractParagraph}}&lt;/p&gt;
        </textarea
          >
        </div>
        <p class="zws-help-text">
          语法：双大括号变量会转义输出，三重大括号原样输出 XML；支持
          if/else、each 控制结构。
        </p>

        <div class="preview-box">
          <label class="zws-label">标题预览</label>
          <div class="zws-preview">
            Example Paper Title: Zotero → WPS Notes Sync via MCP
          </div>
        </div>
        <div class="preview-box">
          <label class="zws-label">正文预览</label>
          <div class="zws-preview">
            &lt;h1&gt;Example Paper Title...&lt;/h1&gt;
          </div>
        </div>
      </div>
    </div>

    <style>
      .page {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 24px;
        background: #f8fafc;
        min-height: 100vh;
      }
      .page-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }
      .page-header h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .page-header .version {
        font-size: 12px;
        color: var(--zws-text-muted);
        margin-left: auto;
      }
      .card + .card {
        margin-top: 20px;
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px 24px;
      }
      .preview-box {
        margin-top: 8px;
      }
    </style>
  </body>
</html>
