<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e40af" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="6" y="6" width="84" height="84" rx="20" ry="20" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Document / page on the left (Zotero) -->
  <path d="M28 30 h20 a4 4 0 0 1 4 4 v28 a4 4 0 0 1 -4 4 h-20 a4 4 0 0 1 -4 -4 v-28 a4 4 0 0 1 4 -4 z" fill="#ffffff" opacity="0.95"/>
  <rect x="28" y="38" width="16" height="2.5" rx="1.25" fill="#2563eb" opacity="0.7"/>
  <rect x="28" y="44" width="20" height="2.5" rx="1.25" fill="#2563eb" opacity="0.5"/>
  <rect x="28" y="50" width="14" height="2.5" rx="1.25" fill="#2563eb" opacity="0.4"/>

  <!-- Arrow pointing right -->
  <path d="M54 46 h14 m-6 -6 l6 6 l-6 6" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Note / WPS symbol on the right -->
  <path d="M72 34 h8 a3 3 0 0 1 3 3 v22 a3 3 0 0 1 -3 3 h-8 a3 3 0 0 1 -3 -3 v-22 a3 3 0 0 1 3 -3 z" fill="#ffffff" opacity="0.25"/>
  <text x="76" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">W</text>
</svg>
