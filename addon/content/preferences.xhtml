<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label>
    <html:h2 data-l10n-id="pref-title"></html:h2>
  </label>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-mcpInterfaceType"
      data-l10n-id="pref-mcpInterfaceType"
      style="min-width: 100px"
    ></html:label>
    <html:select
      id="zotero-prefpane-__addonRef__-mcpInterfaceType"
      preference="mcpInterfaceType"
      style="flex: 1"
    >
      <html:option
        value="cloud"
        data-l10n-id="pref-mcpInterfaceType-cloud"
      ></html:option>
      <html:option
        value="local"
        data-l10n-id="pref-mcpInterfaceType-local"
      ></html:option>
    </html:select>
  </hbox>

  <vbox id="zotero-prefpane-__addonRef__-cloud-config">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-wpsMcpEndpoint"
        data-l10n-id="pref-wpsMcpEndpoint"
        style="min-width: 100px"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-wpsMcpEndpoint"
        preference="wpsMcpEndpoint"
        style="flex: 1"
      ></html:input>
    </hbox>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-wpsMcpApiKey"
        data-l10n-id="pref-wpsMcpApiKey"
        style="min-width: 100px"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-wpsMcpApiKey"
        style="flex: 1"
      ></html:input>
    </hbox>
  </vbox>

  <vbox id="zotero-prefpane-__addonRef__-local-config" hidden="true">
    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-localMcpUrl"
        data-l10n-id="pref-localMcpUrl"
        style="min-width: 100px"
      ></html:label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-localMcpUrl"
        preference="localMcpUrl"
        style="flex: 1"
      ></html:input>
    </hbox>

    <hbox align="center">
      <html:label
        for="zotero-prefpane-__addonRef__-localMcpToken"
        data-l10n-id="pref-localMcpToken"
        style="min-width: 100px"
      ></html:label>
      <html:input
        type="password"
        id="zotero-prefpane-__addonRef__-localMcpToken"
        style="flex: 1"
      ></html:input>
    </hbox>
  </vbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-defaultTags"
      data-l10n-id="pref-defaultTags"
      style="min-width: 100px"
    >
    </html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-defaultTags"
      preference="defaultTags"
      style="flex: 1"
    >
    </html:input>
  </hbox>

  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-updateExisting"
      preference="updateExisting"
    >
    </html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-updateExisting"
      data-l10n-id="pref-updateExisting"
    ></html:label>
  </hbox>

  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-incrementalSync"
      preference="incrementalSync"
    >
    </html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-incrementalSync"
      data-l10n-id="pref-incrementalSync"
    ></html:label>
  </hbox>

  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-promptOnConflict"
      preference="promptOnConflict"
    >
    </html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-promptOnConflict"
      data-l10n-id="pref-promptOnConflict"
    ></html:label>
  </hbox>

  <html:label data-l10n-id="pref-syncInclude-title"></html:label>
  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-syncIncludeAbstract"
      preference="syncIncludeAbstract"
    >
    </html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-syncIncludeAbstract"
      data-l10n-id="pref-syncIncludeAbstract"
    >
    </html:label>
  </hbox>
  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-syncIncludeAttachments"
      preference="syncIncludeAttachments"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-syncIncludeAttachments"
      data-l10n-id="pref-syncIncludeAttachments"
    >
    </html:label>
  </hbox>
  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-syncIncludeAnnotations"
      preference="syncIncludeAnnotations"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-syncIncludeAnnotations"
      data-l10n-id="pref-syncIncludeAnnotations"
    >
    </html:label>
  </hbox>
  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-syncIncludeTags"
      preference="syncIncludeTags"
    >
    </html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-syncIncludeTags"
      data-l10n-id="pref-syncIncludeTags"
    ></html:label>
  </hbox>
  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-syncIncludeNotes"
      preference="syncIncludeNotes"
    >
    </html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-syncIncludeNotes"
      data-l10n-id="pref-syncIncludeNotes"
    ></html:label>
  </hbox>

  <hbox align="center">
    <html:input
      type="checkbox"
      id="zotero-prefpane-__addonRef__-autoSyncEnabled"
      preference="autoSyncEnabled"
    >
    </html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-autoSyncEnabled"
      data-l10n-id="pref-autoSyncEnabled"
    ></html:label>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-autoSyncTag"
      data-l10n-id="pref-autoSyncTag"
      style="min-width: 100px"
    >
    </html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-autoSyncTag"
      preference="autoSyncTag"
      style="flex: 1"
      placeholder="例如：同步到 WPS"
    ></html:input>
  </hbox>
  <html:label
    data-l10n-id="pref-autoSyncTag-help"
    style="font-size: 0.85em; color: gray"
  ></html:label>

  <html:label
    for="zotero-prefpane-__addonRef__-titleTemplate"
    data-l10n-id="pref-titleTemplate"
  ></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-titleTemplate"
    preference="titleTemplate"
    rows="1"
    style="width: 100%"
  ></html:textarea>

  <html:label
    for="zotero-prefpane-__addonRef__-bodyTemplate"
    data-l10n-id="pref-bodyTemplate"
  ></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-bodyTemplate"
    preference="bodyTemplate"
    rows="12"
    style="width: 100%; font-family: monospace"
  ></html:textarea>
  <html:label
    data-l10n-id="pref-bodyTemplate-help"
    style="font-size: 0.85em; color: gray"
  ></html:label>

  <html:label
    for="zotero-prefpane-__addonRef__-titlePreview"
    data-l10n-id="pref-titlePreview"
    style="margin-top: 10px"
  >
  </html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-titlePreview"
    rows="1"
    readonly="readonly"
    style="width: 100%; background: #f9f9f9; overflow: auto; resize: vertical"
  ></html:textarea>

  <html:label
    for="zotero-prefpane-__addonRef__-bodyPreview"
    data-l10n-id="pref-bodyPreview"
  ></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-bodyPreview"
    rows="10"
    readonly="readonly"
    style="
      width: 100%;
      font-family: monospace;
      background: #f9f9f9;
      overflow: auto;
      resize: vertical;
    "
  ></html:textarea>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
